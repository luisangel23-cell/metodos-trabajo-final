bookdown::gitbook:
  css: style.css
  config:
    toc:
      before: |
        <li><a href="./">Factores asociados al rendimiento académico</a></li>
      after: |
        <li><a href="https://github.com/luisangel23-cell/metodos-trabajo-final" target="_blank">Ver repositorio en GitHub</a></li>
    edit: https://github.com/luisangel23-cell/metodos-trabajo-final/edit/main/%s
    sharing:
      github: yes
      facebook: no
      twitter: no
      all: ['github']
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
bookdown::epub_book: default
bookdown::bs4_book: default
